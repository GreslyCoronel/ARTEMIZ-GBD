<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<header class="header">
    <!-- Logo que redirige a la página principal -->
    <div class="logo">
      <a routerLink="/">
        <img src="" alt="Artemiz-logo">
      </a>
    </div>
  
    <!-- Barra de búsqueda -->
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos..." />
      <button><i class="fas fa-search"></i></button>
    </div>
  
    
    <nav class="nav-links">
      <a routerLink="">Cuadros</a>
      <a routerLink="">Llaveros</a>
      <a routerLink="">Conoce más</a>
    </nav>
  
    
    <div class="user-actions">
      <a routerLink="">
        <img src="" alt="login">
      </a>
    </div>
</header>
<body>
    <form action="">
        <div class="container">
            <h1 class="h1">Login</h1>
            <div class="logo">
                <img src="" alt="">
            </div>
            <div class="email">
                <label for="email">Correo electronico</label>
                <input type="text" id="email">
            </div>

            <div class="password">
                <label for="password">Contraseña</label>
                <input type="password" id="password">
            </div>

            <button  class="button">Iniciar sesión</button>

            <p class="login-link"><a href="/frontend/src/app/registro/registro.component.html"></a>No tienes cuenta, ¡Registrate aqui!</p>
        </div>
    </form>
</body>
</html>
